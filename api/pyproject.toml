[project]
name = "indeed-job-scraper-api"
version = "0.1.0"
description = "Read-only FastAPI backend over the indeed-job-scraper state directory."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    # The API reuses indeed_scraper for paths and file parsing. That package
    # imports rich at module level (indeed_scraper/scraper.py), so rich is a
    # hard runtime dependency here even though the API never renders a table.
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
